<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Piggy Duo – Heo đất của đôi mình</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#3b2a6b;--mut:#7d74a8;--pink:#ff7a9c;--pink2:#ffb0c4;--vio:#8f7cf0;--sky:#dff0ff;--card:rgba(255,255,255,.88);--bg1:#f3e8ff;--bg2:#ffe6ef;--ok:#1c9a62}
@media(prefers-color-scheme:dark){:root{--ink:#f1eaff;--mut:#b7accf;--card:rgba(48,38,82,.9);--bg1:#2a2150;--bg2:#3a2147;--sky:#2d3a63}}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:Nunito,system-ui,sans-serif;color:var(--ink);background:radial-gradient(circle at 10% 0,#ffd9ec 0,transparent 45%),radial-gradient(circle at 95% 25%,#d3e4ff 0,transparent 45%),linear-gradient(160deg,var(--bg1),var(--bg2));background-attachment:fixed;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#app{max-width:440px;margin:0 auto;min-height:100%;padding:14px 16px 96px;position:relative}
h1{font-size:25px;font-weight:900;line-height:1.2;text-align:center}h2{font-size:19px;font-weight:900}h3{font-size:14px;font-weight:800}
.mut{color:var(--mut);font-size:13px;font-weight:700}.c{text-align:center}
.card{background:var(--card);border-radius:32px;padding:18px;margin-top:14px;border:2px solid rgba(255,255,255,.95);box-shadow:0 16px 34px rgba(143,124,240,.24),inset 0 3px 0 rgba(255,255,255,.9),inset 0 -6px 14px rgba(143,124,240,.08)}
.row{display:flex;gap:10px;align-items:center}.sp{justify-content:space-between}.g{flex:1}
.btn{position:relative;overflow:hidden;border:0;border-radius:999px;padding:16px 20px;font:900 17px Nunito,system-ui,sans-serif;color:#fff;text-shadow:0 2px 3px rgba(150,30,70,.35);background:linear-gradient(180deg,#ff9fb9,#ff5c85);box-shadow:0 6px 0 #d63f69,0 16px 24px rgba(255,92,133,.4),inset 0 2px 0 rgba(255,255,255,.6);width:100%;cursor:pointer;transition:transform .1s}.btn::after{content:'';position:absolute;left:7%;right:7%;top:3px;height:42%;border-radius:999px;background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0));pointer-events:none}.btn:active{transform:translateY(4px)}.btn.o::after{display:none}
.btn.v{background:linear-gradient(180deg,#b6a8ff,#7f6af0);text-shadow:0 2px 3px rgba(60,30,150,.4);box-shadow:0 6px 0 #5f4ccf,0 16px 24px rgba(127,106,240,.4),inset 0 2px 0 rgba(255,255,255,.6)}
.btn.o{background:rgba(255,255,255,.6);color:var(--vio);text-shadow:none;box-shadow:inset 0 0 0 2px var(--vio)}
.btn:disabled{opacity:.5}.btn:focus-visible,.chip:focus-visible,.tab:focus-visible{outline:3px solid var(--vio)}
.chip{border:0;border-radius:999px;padding:9px 14px;font:800 13px Nunito,system-ui,sans-serif;background:rgba(143,124,240,.14);color:var(--ink);cursor:pointer}
.chip.on{background:linear-gradient(180deg,#b6a8ff,#7f6af0);color:#fff;box-shadow:0 0 0 2px #fff,0 5px 12px rgba(127,106,240,.5),inset 0 2px 0 rgba(255,255,255,.5)}.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
label{display:block;font-size:13px;font-weight:800;margin:12px 0 5px}
input,select{width:100%;border:2px solid rgba(143,124,240,.25);border-radius:16px;padding:13px;font:800 16px Nunito,system-ui,sans-serif;background:rgba(255,255,255,.7);color:#3b2a6b}
.bar{height:18px;border-radius:12px;background:rgba(143,124,240,.2);overflow:hidden;box-shadow:inset 0 3px 5px rgba(80,50,160,.18)}.bar i{display:block;height:100%;border-radius:12px;background:linear-gradient(180deg,#ffd36b,#ff7a9c);box-shadow:inset 0 3px 0 rgba(255,255,255,.55);transition:width 1s}
.big{font-size:44px;font-weight:900;letter-spacing:-1px}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);backdrop-filter:blur(14px);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;box-shadow:0 -6px 24px rgba(143,124,240,.2);z-index:5}
.nav>div{display:flex;max-width:440px;width:100%}
.tab{flex:1;border:0;background:none;font:800 11px Nunito,system-ui,sans-serif;color:var(--mut);padding:6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}.tab b{font-size:22px}.tab.on{color:var(--pink)}
.av{width:48px;height:48px;border-radius:50%;border:3px solid #fff;background:linear-gradient(180deg,#fff,#ffe1ec);display:grid;place-items:center;font-size:26px;box-shadow:0 3px 10px rgba(0,0,0,.12)}
.hero{border-radius:36px;padding:14px 10px 20px;background:radial-gradient(ellipse 75% 20% at 50% 106%,#8fd36a 0,#8fd36a 68%,transparent 70%),radial-gradient(circle at 16% 16%,#fff 0,#fff 8%,transparent 9%),radial-gradient(circle at 24% 14%,#fff 0,#fff 6%,transparent 7%),radial-gradient(circle at 86% 10%,#fff 0,#fff 7%,transparent 8%),linear-gradient(180deg,#9fd8ff,#e8f9d9);text-align:center;position:relative;overflow:hidden;border:3px solid #fff;box-shadow:0 18px 34px rgba(100,160,255,.3),inset 0 3px 0 rgba(255,255,255,.8)}.hero::before{content:'✨';position:absolute;left:12%;top:38%;font-size:20px}.hero::after{content:'✨';position:absolute;right:12%;top:30%;font-size:16px}
.bob{animation:bob 2.4s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-8px)}}
.fall{position:fixed;top:-30px;font-size:26px;animation:fall 2.4s linear forwards;z-index:20;pointer-events:none}@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
.slot{font-size:30px;font-weight:900;padding:12px;border-radius:20px;background:#fff;color:#ff5c85;flex:1;text-align:center;font-variant-numeric:tabular-nums}
.ev{display:flex;gap:12px;padding:12px 0;border-bottom:1px dashed rgba(143,124,240,.25)}.ev:last-child{border:0}.ev>b{font-size:26px}
.pill{font-size:11px;font-weight:900;padding:3px 9px;border-radius:99px;background:#d9f7e8;color:#12724a}.pill.w{background:#fff0c9;color:#8a6200}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#3b2a6b;color:#fff;padding:10px 16px;border-radius:99px;font-weight:800;z-index:30}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.ph{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.ill img{width:calc(100% + 32px);margin:-14px -16px 0;display:block;-webkit-mask-image:linear-gradient(#000 88%,transparent);mask-image:linear-gradient(#000 88%,transparent)}
.hero2{margin-top:12px;border-radius:34px;overflow:hidden;border:3px solid #fff;box-shadow:0 14px 30px rgba(100,160,255,.3)}.hero2 img{width:100%;display:block}
.pv{background:linear-gradient(180deg,#6a4fd6,#a98cf5 50%,#ffd9ea)!important;background-attachment:fixed!important}
.glob{margin:-30px -16px 0}.glob img{width:100%;display:block;-webkit-mask-image:linear-gradient(#000 82%,transparent);mask-image:linear-gradient(#000 82%,transparent)}
.sheet{margin:-26px -16px 0;background:linear-gradient(180deg,#fff,#ffeaf2);border-radius:34px;padding:20px 18px;position:relative;color:#3b2a6b}.sheet .mut{color:#7d74a8}
.frame{margin:14px auto;width:230px;height:200px;border-radius:44px;background:linear-gradient(160deg,#cfe0ff,#e9e3ff);border:3px solid #fff;box-shadow:0 14px 30px rgba(110,120,220,.3);display:grid;place-items:center;overflow:hidden}.frame img{width:92%}
.thb{border:3px solid #fff;border-radius:22px;padding:0;width:62px;height:62px;overflow:hidden;background:#fff;box-shadow:0 5px 12px rgba(143,124,240,.3);cursor:pointer}.thb.on{border-color:#8f7cf0;box-shadow:0 0 0 3px #c9bcff}.thb img{width:100%;height:100%;object-fit:cover;display:block}
.ev{position:relative}.ev::before{content:'';position:absolute;left:22px;top:0;bottom:0;border-left:2px solid #bcd9ff}.ico{width:46px;height:46px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 4px 10px rgba(143,124,240,.25);flex:none;z-index:1}
.ban{display:flex;align-items:center;border-radius:28px;padding:16px;margin-top:12px;background:linear-gradient(120deg,#3f7bff,#9b6bff);box-shadow:0 14px 28px rgba(80,90,230,.35);overflow:hidden}.ban img{width:120px;border-radius:24px;margin:-6px -8px -6px 0;-webkit-mask-image:linear-gradient(to right,transparent,#000 30%);mask-image:linear-gradient(to right,transparent,#000 30%)}
.nav{border-radius:28px 28px 0 0}
</style></head><body><div id="app"></div><div id="nav"></div>

function calc(){const sa=share(),days=S.months*30,tot={a:0,b:0},pend={a:0,b:0};
 Object.values(S.rev).forEach(r=>{['a','b'].forEach(k=>{r['c'+k]?tot[k]+=r[k]:pend[k]+=r[k]})});
 const saved=tot.a+tot.b,p=Math.min(100,saved/S.goal*100),done=Object.keys(S.rev).length,left=Math.max(1,days-done);
 const need={a:Math.max(0,S.goal*sa-tot.a),b:Math.max(0,S.goal*(1-sa)-tot.b)};
 const monthly=S.goal/S.months,inc=S.a.i+S.b.i,avg=done?saved/done:0;
 return{sa,days,tot,pend,saved,p,done,left,need,monthly,inc,avg,eta:avg?Math.ceil((S.goal-saved)/avg):null}}

 return `<div class="row sp"><button class="chip" data-a="step" data-v="0">‹ Quay lại</button></div><h1 style="margin-top:8px">Tạo heo của bạn</h1><p class="mut c">Chọn kiểu và đặt tên cho heo nhé!</p>
 <div class="frame"><img class="bob" src="${IM[S.pig.st=='crown'?'big':THUMB[S.pig.st]]}" alt="Heo"></div><div class="row" style="justify-content:center">${STY.map(([k])=>`<button class="thb ${S.pig.st==k?'on':''}" data-a="pst" data-v="${k}" aria-label="Kiểu heo ${k}"><img src="${IM[THUMB[k]]}" alt=""></button>`).join('')}</div>
 
 <div class="card"><label style="margin-top:0">Tên heo</label><input data-k="pig.nm" value="${S.pig.nm}"></div>
 <button class="btn" style="margin-top:16px" data-a="finish">Xác nhận</button>`}
function preview(){const sa=share(),c=calc();const mA=S.a.i/Math.max(1,S.a.i+S.b.i);
 const ok=S.goal/S.months<=(S.a.i+S.b.i)*.5;
 return `<div class="card" style="background:rgba(143,124,240,.1);box-shadow:none"><h3>Dự tính</h3><p class="mut" style="margin-top:6px;line-height:1.7">
 Thu nhập chung: <b>${vnd(S.a.i+S.b.i)}</b>/tháng<br>Tỷ lệ thu nhập: ${S.a.n} ${(mA*100).toFixed(1)}% · ${S.b.n} ${((1-mA)*100).toFixed(1)}%<br>
 Mức góp kế hoạch: ${S.a.n} ${(sa*100).toFixed(1)}% · ${S.b.n} ${((1-sa)*100).toFixed(1)}%<br>
 Cần tiết kiệm: <b>${vnd(S.goal/S.months)}</b>/tháng ≈ <b>${vnd(S.goal/S.months/30)}</b>/ngày<br>
 ${ok?'✅ Mục tiêu khả thi (dưới 50% thu nhập chung).':'⚠️ Mục tiêu khá cao so với thu nhập, hãy cân nhắc kéo dài thời gian.'}</p></div>`}
function head(){const c=calc();return `<div class="row sp"><div class="row"><div class="av">${S.a.av}</div><div class="av" style="margin-left:-18px">${S.b.av}</div></div><div class="c g"><h2>${S.name} 💗</h2></div><div class="av" aria-label="Thông báo" style="position:relative">🔔<i style="position:absolute;top:2px;right:2px;width:12px;height:12px;border-radius:50%;background:#ff4d6d;border:2px solid #fff"></i></div></div><p class="mut c" style="margin-top:4px">Cùng nhau tiết kiệm, cùng nhau hạnh phúc!</p>`}
function memCard(c){return `<div class="card row sp" style="margin-top:12px">${['a','b'].map(k=>{const t=c.tot[k],pc=c.saved?t/c.saved*100:0;return `<div class="g"><div class="row"><div class="av" style="width:38px;height:38px;font-size:20px">${S[k].av}</div><div><h3>${M(t)}</h3><span class="mut">${S[k].n} · ${pc.toFixed(1)}%</span></div></div><div class="bar" style="height:8px;margin-top:8px"><i style="width:${pc}%"></i></div></div>`}).join('')}</div>
 <p class="mut c" style="margin-top:6px;font-size:12px">Mức góp kế hoạch: ${(c.sa*100).toFixed(1)}% / ${(100-c.sa*100).toFixed(1)}% · Thu nhập: ${(S.a.i/c.inc*100).toFixed(1)}% / ${(S.b.i/c.inc*100).toFixed(1)}%</p>`}
function dailyCard(c){const r=S.rev[today()];
 if(c.p>=100)return `<div class="card c"><h2>🎉 Hoàn thành mục tiêu!</h2><p class="mut">Hai bạn đã chạm đích. Bắt đầu mục tiêu mới ở tab “Của chúng mình”.</p></div>`;
 if(!r)return `<div class="card c"><h3 style="font-size:16px">🐷 Hôm nay tụi mình góp bao nhiêu nhỉ?</h3><p class="mut" style="margin:4px 0 12px">Một lần mỗi ngày, cả hai cùng xem kết quả.</p><button class="btn" data-a="open">MỞ SỐ TIỀN HÔM NAY</button></div>`;
 return `<div class="card"><div class="row sp"><h3>Kết quả hôm nay</h3><span class="pill ${r.ca&&r.cb?'':'w'}">${r.ca&&r.cb?'Đã xác nhận đủ':'Chờ xác nhận'}</span></div>
 <div class="row" style="margin-top:10px">${['a','b'].map(k=>`<div class="g c"><div class="av" style="margin:auto">${S[k].av}</div><h2 style="color:#ff5c85;margin-top:4px">+${vnd(r[k])}</h2><span class="mut">${S[k].n} ${r['c'+k]?'✅':'⏳'}</span></div>`).join('')}</div>
 <button class="btn v" style="margin-top:12px" data-a="open">Xem / xác nhận</button></div>`}
function home(){const c=calc();
 return head()+`<div class="hero2"><img src="${IM.hero}" alt="Heo đất"></div><div style="margin-top:-4px;position:relative;padding:0 6px">
 <div class="card" style="margin:8px 6px 0;background:linear-gradient(180deg,#a6e27e,#5fbf6e);color:#fff;border-color:#e6ffd6"><div class="big" style="font-size:52px;text-shadow:0 3px 0 rgba(30,110,60,.35)">${c.p.toFixed(1).replace('.',',')}<small style="font-size:26px">%</small></div><div style="font-weight:800;opacity:.95">${vnd(c.saved)} / ${vnd(S.goal)}</div><div class="bar" style="margin-top:10px;background:rgba(255,255,255,.4)"><i style="width:${c.p}%"></i></div></div></div>`
 +memCard(c)+dailyCard(c)+`<div class="row" style="margin-top:14px"><button class="btn" data-a="open" style="padding:13px">＋ Nạp tiền</button><button class="btn v" data-a="go" data-v="stats" style="padding:13px">📊 Xem chi tiết</button></div>
 <div class="card row sp"><div class="row"><span style="font-size:34px">🏆</span><div><span class="mut">Mục tiêu của chúng ta</span><h3 style="font-size:17px">${vnd(S.goal)}</h3></div></div><div class="c"><span class="mut">Còn lại</span><h3>${c.eta?Math.ceil(c.eta/30)+' tháng*':Math.ceil(c.left/30)+' tháng'}</h3></div></div>
 <p class="mut" style="font-size:11px;margin-top:6px">*Ước tính dựa trên số tiền đã xác nhận, không phải cam kết.</p>`+recent(3)}
function recent(n){return `<div class="card"><h3>Hoạt động gần đây</h3>${S.log.length?S.log.slice(0,n).map(evRow).join(''):'<p class="mut" style="margin-top:8px">Chưa có hoạt động. Mở số tiền hôm nay để bắt đầu nhé!</p>'}</div>`}
function evRow(e){return `<div class="ev"><b class="ico">${e.ic}</b><div class="g"><h3>${e.txt}</h3><span class="mut">${fmtDT(e.t)}</span></div></div>`}
function revealView(){const T=today(),r=S.rev[T],c=calc();
 const back=`<button class="chip" data-a="go" data-v="" style="background:rgba(255,255,255,.25);color:#fff">‹ Quay lại</button>`;
 const head=`<div class="glob"><img class="${r?'':'bob'}" src="${IM.glob}" alt=""></div>`;
 if(!r)return back+head+`<div class="sheet"><p class="c" style="font-weight:800">Hệ thống sẽ random số tiền<br>cho mỗi người trong ngày này!</p><p class="mut c" style="margin:8px 0 14px">Tổng tiền vẫn bằng nhau theo mục tiêu nhé 💗</p><div class="row"><div class="slot" id="sa">???</div><div class="slot" id="sb">???</div></div><button class="btn v" id="go" style="margin-top:16px" data-a="roll">MỞ KẾT QUẢ HÔM NAY</button></div>`;
 const both=r.ca&&r.cb;
 return back+head+`<div class="sheet"><h3 class="c" style="font-size:17px;color:#6a4cd8">Kết quả hôm nay</h3><div class="row" style="margin-top:10px">${['a','b'].map(k=>`<div class="g c"><div class="av" style="margin:auto;width:60px;height:60px">${S[k].av}</div><span class="mut">${S[k].n} ${r['c'+k]?'✅':'⏳'}</span><h2 style="color:${k=='a'?'#3b82f6':'#ff4d8d'}">+${vnd(r[k])}</h2></div>`).join('')}</div>
 <div class="row sp" style="margin-top:12px"><span class="mut">Tiến độ mục tiêu</span><b>${c.p.toFixed(1)}%</b></div>
 <p class="mut" style="margin:10px 0 6px">Chỉ số tiền đã xác nhận mới được cộng vào heo.</p>
 ${['a','b'].map(k=>r['c'+k]?`<div class="pill" style="margin:4px 0;display:block;text-align:center">${S[k].n} đã góp ✅</div>`:`<button class="btn" style="margin-top:8px;padding:12px" data-a="conf" data-v="${k}">${S[k].n} xác nhận đã góp</button>`).join('')}
 ${both?'<p class="c" style="margin-top:10px;font-weight:900;color:var(--ok)">🎉 Cả hai đã góp xong! Heo vui lắm!</p>':''}
 <button class="btn v" style="margin-top:12px" data-a="go" data-v="journal">Xem nhật ký</button></div>`}
function journal(){const f=S.f||'all',L=S.log.filter(e=>f=='all'||e.type==f);
 return `<h1 style="text-align:left">Nhật ký tiết kiệm</h1><div class="chips">${[['all','Tất cả'],['rev','Kết quả'],['conf','Góp tiền'],['ms','Cột mốc']].map(([k,t])=>`<button class="chip ${f==k?'on':''}" data-a="filt" data-v="${k}">${t}</button>`).join('')}</div>
 <div class="card">${L.length?L.map(evRow).join(''):'<p class="mut c">Chưa có sự kiện nào. Lịch sử tài chính sẽ không bị xóa âm thầm.</p>'}</div>`}
function stats(){const c=calc(),R=Object.entries(S.rev).sort().slice(-10),mx=Math.max(1,...R.map(([,r])=>r.a+r.b));
 return `<button class="chip" data-a="go" data-v="">‹ Quay lại</button><h1 style="margin-top:8px">Thống kê</h1>
 <div class="card"><span class="mut">Tổng đã tiết kiệm (đã xác nhận)</span><div class="big">${vnd(c.saved)}</div><span class="mut">Trung bình ${vnd(c.avg)}/ngày · ${c.done} ngày đã mở</span></div>
 <div class="card"><h3>Tỷ lệ đóng góp thực tế</h3>${['a','b'].map(k=>{const pc=c.saved?c.tot[k]/c.saved*100:0;return `<div style="margin-top:10px"><div class="row sp"><b>${S[k].n}</b><b>${pc.toFixed(1)}%</b></div><div class="bar"><i style="width:${pc}%"></i></div></div>`}).join('')}
 <p class="mut" style="margin-top:10px;font-size:12px">Kế hoạch: ${(c.sa*100).toFixed(1)}% / ${(100-c.sa*100).toFixed(1)}% · Thu nhập: ${(S.a.i/c.inc*100).toFixed(1)}% / ${(S.b.i/c.inc*100).toFixed(1)}%</p></div>
 <div class="card"><h3>Số tiền mỗi ngày (10 ngày gần nhất)</h3>${R.length?`<svg viewBox="0 0 300 130" style="width:100%;margin-top:8px">${R.map(([d,r],i)=>{const x=i*30+4,ha=r.a/mx*100,hb=r.b/mx*100;return `<rect x="${x}" y="${110-ha}" width="11" height="${ha}" rx="3" fill="#ff7a9c"/><rect x="${x+12}" y="${110-hb}" width="11" height="${hb}" rx="3" fill="#8f7cf0"/><text x="${x+11}" y="125" font-size="8" text-anchor="middle" fill="#7d74a8">${d.slice(8)}</text>`}).join('')}</svg><p class="mut" style="font-size:12px">🟥 ${S.a.n} · 🟪 ${S.b.n}</p>`:'<p class="mut">Chưa có dữ liệu.</p>'}</div>
 <p class="mut" style="font-size:12px;margin-top:10px">Dự báo hoàn thành: ${c.eta?'khoảng '+c.eta+' ngày nữa (ước tính theo mức trung bình đã xác nhận)':'cần thêm dữ liệu'}.</p>`}
function streak(){const ds=Object.entries(S.rev).filter(([,r])=>r.ca&&r.cb).map(([d])=>d).sort();let s=0,prev=null;for(const d of ds){s=prev&&(new Date(d)-new Date(prev))==864e5?s+1:1;prev=d}return s}
function chall(){const c=calc(),st=streak(),both=Object.values(S.rev).filter(r=>r.ca&&r.cb).length;
 const L=[['🔥','Góp 7 ngày liên tiếp',st,7,'Phụ kiện kính ngầu'],['📅','Góp đủ 30 ngày',both,30,'Nền vườn hoa'],['👫','Hai người cùng góp một ngày',both,1,'Huy hiệu đôi bạn'],...[10,25,50,75,100].map(x=>['🎯','Đạt '+x+'% mục tiêu',Math.floor(c.p),x,x==100?'Kho báu':'Huy hiệu '+x+'%'])];
 return `<h1 style="text-align:left">Thử thách tiết kiệm</h1><p class="mut">Tùy chọn và vui là chính. Bỏ lỡ một ngày cũng không sao nhé 💗</p><div class="ban"><div class="g"><h2 style="color:#fff">Thử thách 30 ngày</h2><p style="color:#eaf0ff;font-weight:700;margin:4px 0 10px">Góp ít nhất 50.000đ/ngày để nhận thưởng!</p><button class="btn" data-a="tab" data-v="home" style="width:auto;padding:9px 22px;font-size:14px">Tham gia</button></div><img src="${IM.chal}" alt=""></div>
 ${L.map(([i,t,v,m,rw])=>{const pc=Math.min(100,v/m*100);return `<div class="card"><div class="row"><span style="font-size:32px">${i}</span><div class="g"><h3>${t}</h3><span class="mut">Thưởng: ${rw}</span></div>${pc>=100?'<span class="pill">Hoàn thành</span>':`<span class="mut">${Math.min(v,m)}/${m}</span>`}</div><div class="bar" style="margin-top:8px"><i style="width:${pc}%"></i></div></div>`}).join('')}`}
function couple(){const c=calc();
 return `<h1>Của chúng mình ❤️</h1><div class="hero2"><img src="${IM.duo}" alt=""></div><p class="c" style="font-weight:800;margin-top:10px">Cùng nhau, chúng ta có thể<br>đạt được nhiều hơn! 💕</p>
 <div class="card"><div class="row sp">${['a','b'].map(k=>`<div class="c g"><div class="av" style="margin:auto">${S[k].av}</div><h3>${S[k].n}</h3><span class="mut">${vnd(S[k].i)}/tháng</span></div>`).join('')}</div></div>
 <div class="card"><div class="row sp"><span class="mut">Tổng 2 người đã góp</span><h2>${vnd(c.saved)}</h2></div><div class="row sp" style="margin-top:6px"><span class="mut">Thời gian</span><b>${S.months} tháng</b></div><div class="row sp" style="margin-top:6px"><span class="mut">Cách chia</span><b>${{prop:'Theo thu nhập',eq:'Chia đều',cus:'Tùy chỉnh'}[S.mode]}</b></div></div>
 <div class="card"><h3>Cài đặt</h3><div class="chips"><button class="chip" data-a="edit">✏️ Sửa mục tiêu & thu nhập</button><button class="chip" data-a="export">⬇️ Xuất dữ liệu</button><button class="chip" data-a="reset">🗑️ Xóa hành trình</button></div>
 <p class="mut" style="font-size:12px;line-height:1.6;margin-top:6px">📲 Cài như app: iPhone mở bằng Safari → Chia sẻ → “Thêm vào Màn hình chính”. Android: menu ⋮ → “Cài đặt ứng dụng”.<br>Piggy Duo chỉ ghi lại cam kết, không giữ hay chuyển tiền thật.</p></div>`}

/* ---------- render & events ---------- */
function render(){const app=$('#app'),nav=$('#nav');document.body.className=S.setup&&S.view=='reveal'?'pv':'';
 if(!S.setup){app.innerHTML=onboard();nav.innerHTML='';return}
 const v=S.view,t=S.tab;
 app.innerHTML=v=='reveal'?revealView():v=='stats'?stats():{home,journal,chall,couple}[t]();
 nav.innerHTML=v?'':`<div class="nav"><div>${[['home','🏠','Trang chủ'],['journal','📖','Nhật ký'],['chall','🏅','Thử thách'],['couple','💗','Của chúng mình']].map(([k,i,l])=>`<button class="tab ${t==k?'on':''}" data-a="tab" data-v="${k}"><b>${i}</b>${l}</button>`).join('')}</div></div>`}
function roll(){const T=today();let r=S.rev[T];if(!r){const g=genReveal();r={...g,ca:false,cb:false,by:'a',t:Date.now()};S.rev[T]=r;log('rev','🐷',`Kết quả hôm nay: ${S.a.n} +${vnd(r.a)} · ${S.b.n} +${vnd(r.b)}`);save()}
 const b=$('#go');b.disabled=true;const red=matchMedia('(prefers-reduced-motion:reduce)').matches,dur=red?300:2800,t0=Date.now();
 if(navigator.vibrate)navigator.vibrate(40);rain('🪙',red?0:14);
 const iv=setInterval(()=>{const el=Date.now()-t0;if(el>=dur){clearInterval(iv);rain('🎊',14);render();return}
  ['a','b'].forEach(k=>{$('#s'+k).textContent='+'+vnd(Math.random()*S.goal/S.days_||Math.random()*900000)})},70)}
const A={
 months:v=>{S.months=+v;rr()},mode:v=>{S.mode=v;rr()},av:v=>{S[v[0]].av=AVS[+v.slice(1)];rr()},pst:v=>{S.pig.st=v;rr()},
 step:v=>{if(+v==1&&(!S.a.n.trim()||!S.b.n.trim()||S.goal<1e6)){return toast('Hãy nhập tên và mục tiêu từ 1.000.000đ')}S.step=+v;rr()},
 finish:()=>{S.setup=true;S.view='';S.tab='home';log('ms','🌱','Bắt đầu hành trình “'+S.name+'”');rain('🪙');rr()},
 demo:()=>{const d=new Date();for(let i=10;i>=1;i--){const x=new Date(d-i*864e5).toLocaleDateString('sv-SE',{timeZone:TZ});S.rev[x]={a:Math.round(Math.random()*30+10)*10000,b:Math.round(Math.random()*30+10)*10000,ca:true,cb:true,by:'a',t:+new Date(d-i*864e5)}}S.setup=true;S.pig.st='crown';log('ms','🌱','Đã tải dữ liệu mẫu');rr()},
 tab:v=>{S.tab=v;S.view='';rr()},go:v=>{S.view=v;if(!v)S.tab=S.tab||'home';rr()},open:()=>{S.view='reveal';rr()},roll,filt:v=>{S.f=v;rr()},
 conf:k=>{const r=S.rev[today()],b=calc().p;r['c'+k]=true;log('conf','💰',`${S[k].n} đã xác nhận góp ${vnd(r[k])}`);const a=calc().p;
  [10,25,50,75,100].forEach(x=>{if(b<x&&a>=x){log('ms','🎉','Đạt '+x+'% mục tiêu!');rain('🎉',24)}});if(r.ca&&r.cb)rain('🪙');save();rr()},
 export:()=>{const u=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download='piggy-duo.json';a.click()},
 reset:()=>{if(confirm('Xóa toàn bộ hành trình? Hành động này không thể hoàn tác.')){S=JSON.parse(JSON.stringify(DEF));rr()}},
 edit:()=>{S.setup=false;S.step=0;rr()}};
function rr(){save();render();scrollTo(0,0)}
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(t&&A[t.dataset.a])A[t.dataset.a](t.dataset.v)});
document.addEventListener('input',e=>{const t=e.target,k=t.dataset.k;if(!k)return;let v=t.dataset.m?num(t.value):t.value;if(t.dataset.m)t.value=v.toLocaleString('vi-VN');if(t.type=='range'){v=+v;$('#pc').textContent=v}
 const p=k.split('.');p.length>1?S[p[0]][p[1]]=v:S[k]=v;save();const pv=$('#pv');if(pv)pv.innerHTML=preview()});
S.days_=S.months*30;render();
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))try{navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
</script></body></html>
